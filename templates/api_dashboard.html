<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Boshqaruv Paneli</title>
    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #171b26;
            --card-bg: #171b26;
            
            /* Shadows for 3D convex protrusion (soft UI) */
            --dark-shadow: #0b0d13;
            --light-shadow: #232939;
            
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            margin-bottom: 28px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 3px 3px 6px var(--dark-shadow);
        }

        header p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* Neumorphic Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--card-bg);
            border: none;
            border-radius: 20px;
            padding: 18px 10px;
            text-align: center;
            box-shadow: 6px 6px 14px var(--dark-shadow), -6px -6px 14px var(--light-shadow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 18px var(--dark-shadow), -8px -8px 18px var(--light-shadow);
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 1px 1px 2px var(--dark-shadow);
        }

        .stat-card .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Neumorphic Sections */
        .action-section, .keys-section {
            background: var(--card-bg);
            border: none;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 9px 9px 18px var(--dark-shadow), -9px -9px 18px var(--light-shadow);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 2px var(--dark-shadow);
        }

        .form-group {
            display: flex;
            gap: 14px;
            flex-direction: column;
        }

        /* Concave Neumorphic Inputs */
        .form-input {
            width: 100%;
            height: 48px;
            background: var(--card-bg);
            border: none;
            border-radius: 14px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            box-shadow: inset 4px 4px 8px var(--dark-shadow), inset -4px -4px 8px var(--light-shadow);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            box-shadow: inset 4px 4px 8px var(--dark-shadow), inset -4px -4px 8px var(--light-shadow), 0 0 0 1.5px var(--primary-color);
        }

        /* Convex Neumorphic Buttons */
        .btn {
            height: 48px;
            padding: 0 24px;
            background: var(--primary-color);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 6px 6px 12px var(--dark-shadow), -6px -6px 12px var(--light-shadow), inset 1px 1px 2px rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 8px 8px 16px var(--dark-shadow), -8px -8px 16px var(--light-shadow), inset 1px 1px 2px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px var(--dark-shadow), inset -4px -4px 8px var(--light-shadow);
        }

        .btn-secondary {
            background: var(--card-bg) !important;
            color: #ffffff !important;
            box-shadow: 5px 5px 10px var(--dark-shadow), -5px -5px 10px var(--light-shadow) !important;
            border: none !important;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.02) !important;
        }
        
        .btn-secondary:active {
            box-shadow: inset 4px 4px 8px var(--dark-shadow), inset -4px -4px 8px var(--light-shadow) !important;
        }

        .btn-danger {
            background: var(--danger-color) !important;
            color: #ffffff !important;
            box-shadow: 5px 5px 10px var(--dark-shadow), -5px -5px 10px var(--light-shadow) !important;
            border: none !important;
        }
        
        .btn-danger:hover {
            filter: brightness(1.1);
        }
        
        .btn-danger:active {
            box-shadow: inset 4px 4px 8px var(--dark-shadow), inset -4px -4px 8px var(--light-shadow) !important;
        }

        .keys-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Convex Neumorphic Key Items */
        .key-item {
            background: var(--card-bg);
            border: none;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            box-shadow: 6px 6px 14px var(--dark-shadow), -6px -6px 14px var(--light-shadow);
            transition: all 0.2s ease;
        }

        .key-item:hover {
            transform: translateY(-1px);
            box-shadow: 8px 8px 18px var(--dark-shadow), -8px -8px 18px var(--light-shadow);
        }

        .key-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .key-value {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 1px 1px var(--dark-shadow);
        }

        /* Concave Key Mask Box */
        .key-value.masked {
            font-family: monospace;
            background: var(--card-bg);
            border: none;
            box-shadow: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow);
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            color: #818cf8;
            transition: all 0.2s ease;
        }
        
        .key-value.masked:hover {
            color: #a5b4fc;
        }

        /* Status Badge */
        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.1), 2px 2px 4px var(--dark-shadow);
        }

        .badge-active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .badge-blocked {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        /* Neumorphic Switch toggle button */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--card-bg);
            box-shadow: inset 2.5px 2.5px 5px var(--dark-shadow), inset -2.5px -2.5px 5px var(--light-shadow);
            transition: .25s ease;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            box-shadow: 2px 2px 4px var(--dark-shadow);
            transition: .25s ease;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success-color);
            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            box-shadow: -2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .key-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            padding-top: 12px;
        }

        /* Neumorphic Tariff Item */
        .tariff-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--card-bg);
            box-shadow: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow);
            padding: 12px;
            border-radius: 14px;
            border: none;
            flex-wrap: wrap;
        }

        .tariff-item .form-input {
            text-align: center;
            margin: 0;
            height: 38px;
            border-radius: 10px;
            border: none;
            box-shadow: inset 2.5px 2.5px 5px var(--dark-shadow), inset -2.5px -2.5px 5px var(--light-shadow);
            background: var(--card-bg);
            color: #ffffff;
        }

        .tariff-item .btn {
            height: 38px;
            font-size: 13px;
            padding: 0 16px;
            width: auto;
            margin: 0;
            border-radius: 10px;
        }

        /* Loader */
        .loader-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(23, 27, 38, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }

        .loader {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .stats-grid {
                gap: 10px;
            }
            .stat-card .value {
                font-size: 20px;
            }
            .stat-card .label {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>API Dashboard</h1>
            <p>Tijoriy API kalitlar va balanslarni boshqarish paneli</p>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="stat-total-keys">0</div>
                <div class="label">Jami kalitlar</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-total-balance">0</div>
                <div class="label">Faol kalitlar</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-total-votes">0</div>
                <div class="label">Muvaffaqiyatli Ovozlar</div>
            </div>
        </div>

        <!-- Create Key Form -->
        <div class="action-section">
            <div class="section-title">➕ Yangi API kalit generatsiya qilish</div>
            <div class="form-group">
                <input type="number" id="create-owner-id" class="form-input" placeholder="Telegram ID (ixtiyoriy)">
                <input type="number" id="create-balance" class="form-input" placeholder="Muddat (kun)" value="15">
                <button onclick="generateKey()" class="btn">🔑 Generatsiya</button>
            </div>
        </div>

        <!-- API Tariffs Section -->
        <div class="action-section" style="margin-top: 24px;">
            <div class="section-title">⚙️ API tariflari narxlarini tahrirlash</div>
            <div id="tariffs-container" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Tariflar shu yerga yuklanadi -->
            </div>
        </div>

        <!-- System Settings Section -->
        <div class="action-section" style="margin-top: 24px;">
            <div class="section-title">💳 Tizim sozlamalari (To'lovlar)</div>
            <div class="form-group" style="flex-direction: column; gap: 12px; align-items: stretch;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 13px; color: var(--text-muted); text-align: left;">Karta raqami (Tarif to'lovlari uchun):</label>
                    <input type="text" id="settings-card-number" class="form-input" placeholder="Karta raqami (masalan: 8600...)" style="width: 100%; margin: 0;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 13px; color: var(--text-muted); text-align: left;">To'lov kanali IDsi (Avtomat tekshirish uchun):</label>
                    <input type="text" id="settings-channel-id" class="form-input" placeholder="Kanal ID (masalan: -100...)" style="width: 100%; margin: 0;">
                </div>
                <button onclick="saveSystemSettings()" class="btn" style="margin-top: 8px; width: 100%;">💾 Sozlamalarni saqlash</button>
            </div>
        </div>

        <!-- API Keys List -->
        <div class="keys-section" style="margin-top: 24px;">
            <div class="section-title">📂 API kalitlar ro'yxati</div>
            <div class="keys-list" id="keys-container">
                <!-- Kalitlar shu yerga yuklanadi -->
            </div>
        </div>
    </div>

    <!-- Loader Container -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p style="color: #ffffff; font-weight: 500;">Yuklanmoqda, kuting...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Pastga tortganda yopilib ketmasligi uchun vertikal swipe (tortish) imo-ishorasini o'chiramiz
        if (tg.isVerticalSwipesEnabled !== undefined) {
            tg.isVerticalSwipesEnabled = false;
        }
        
        // Tasodifan yopilib ketishining oldini olish uchun yopishni tasdiqlash oynasini faollashtiramiz
        try {
            tg.enableClosingConfirmation();
        } catch (e) {
            console.warn("Closing confirmation faollashtirilmadi:", e);
        }

        if (tg.requestFullscreen) {
            try {
                tg.requestFullscreen();
            } catch (e) {
                console.error("To'liq ekran so'rovi bajarilmadi:", e);
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const adminToken = urlParams.get("admin_token") || "";

        const headers = {
            "Content-Type": "application/json",
            "tg-init-data": tg.initData || "",
            "admin-token": adminToken
        };

        function showLoader(show) {
            document.getElementById("loader").style.display = show ? "flex" : "none";
        }

        async function fetchDashboardData() {
            showLoader(true);
            try {
                const response = await fetch("/admin/api/keys?init_data=" + encodeURIComponent(tg.initData || "") + "&admin_token=" + encodeURIComponent(adminToken), { headers });
                if (response.status === 403) {
                    try {
                        const errData = await response.json();
                        alert("Kirish taqiqlangan!\n\nSababi: " + errData.message);
                    } catch (e) {
                        alert("Kirish taqiqlangan! (403 Forbidden)");
                    }
                    tg.close();
                    return;
                }
                const data = await response.json();
                if (data.status === "success") {
                    renderStats(data.stats);
                    renderKeys(data.keys);
                    renderTariffs(data.tariffs);
                    
                    const cardInput = document.getElementById("settings-card-number");
                    const channelInput = document.getElementById("settings-channel-id");
                    if (document.activeElement !== cardInput) {
                        cardInput.value = data.settings.card_number || "";
                    }
                    if (document.activeElement !== channelInput) {
                        channelInput.value = data.settings.payment_channel_id || "";
                    }
                } else {
                    alert("Xatolik yuz berdi: " + data.message);
                }
            } catch (err) {
                alert("Server bilan bog'lanishda xato: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        function renderStats(stats) {
            document.getElementById("stat-total-keys").innerText = stats.total_keys;
            document.getElementById("stat-total-balance").innerText = stats.total_balance.toLocaleString() + " ta";
            document.getElementById("stat-total-votes").innerText = stats.total_votes;
        }

        function renderKeys(keys) {
            const container = document.getElementById("keys-container");
            container.innerHTML = "";

            if (keys.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Hozircha API kalitlar mavjud emas.</div>`;
                return;
            }

            keys.forEach(key => {
                const item = document.createElement("div");
                item.className = "key-item";
                
                // Kalit egasi
                const owner = key.owner_id ? `<code>${key.owner_id}</code>` : `<span style="color: var(--text-muted);">Egasi yo'q</span>`;
                const createdDate = new Date(key.created_at).toLocaleDateString("uz-UZ");

                item.innerHTML = `
                    <div class="key-row">
                        <div>
                            <span class="key-label">Egasi:</span> ${owner}
                        </div>
                        <div>
                            <span class="badge ${key.is_active ? 'badge-active' : 'badge-blocked'}">${key.is_active ? 'Faol' : 'Bloklangan'}</span>
                        </div>
                    </div>
                    <div class="key-row">
                        <div>
                            <span class="key-label">Muddati:</span> 
                            <span style="color: ${key.days_remaining === 'Muddati tugagan' ? 'var(--danger-color)' : 'var(--success-color)'}; font-weight: 700;">
                                ${key.days_remaining}
                            </span>
                        </div>
                        <div>
                            <span class="key-label">Yaratildi:</span> <span style="font-size: 12px;">${createdDate}</span>
                        </div>
                    </div>
                    <div class="key-row" style="margin-top: 2px; font-size: 12px; color: var(--component-muted);">
                        <div>
                            <span class="key-label">Faollashuv:</span> ${key.activated_at}
                        </div>
                        <div>
                            <span class="key-label">Tugash:</span> ${key.expires_at}
                        </div>
                    </div>
                    <div class="key-row" style="margin-top: 4px;">
                        <span class="key-label">Kalit:</span>
                        <span class="key-value masked" onclick="copyKeyText('${key.raw_key_decrypted || 'Nusxalash'}', ${key.id})" id="raw-key-${key.id}">
                            ob_api_${key.key_masked} 📋
                        </span>
                    </div>
                    <div class="key-actions">
                        <button onclick="topUpPrompt(${key.id})" class="btn btn-secondary" style="height: 34px; font-size: 13px; padding: 0 12px;">⏳ +15 kun</button>
                        <button onclick="deleteKey(${key.id})" class="btn btn-danger" style="height: 34px; font-size: 13px; padding: 0 12px;">🗑️ O'chirish</button>
                        <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
                            <span class="key-label">Aktivlik:</span>
                            <label class="switch">
                                <input type="checkbox" ${key.is_active ? 'checked' : ''} onchange="toggleStatus(${key.id}, this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function generateKey() {
            const ownerId = document.getElementById("create-owner-id").value;
            const balance = document.getElementById("create-balance").value;

            if (!balance || parseInt(balance) < 1) {
                alert("Iltimos, boshlang'ich muddatni (kun) to'g'ri kiriting!");
                return;
            }

            showLoader(true);
            try {
                const response = await fetch("/admin/api/keys?init_data=" + encodeURIComponent(tg.initData || ""), {
                    method: "POST",
                    headers,
                    body: JSON.stringify({
                        owner_id: ownerId ? parseInt(ownerId) : null,
                        balance_uzs: 500000,
                        duration_days: parseInt(balance)
                    })
                });
                const data = await response.json();
                if (data.status === "success") {
                    const generatedKey = data.key_plain;
                    alert("🔑 Yangi API kalit generatsiya qilindi!\n\nDasturchi uchun kalit:\n" + generatedKey + "\n\n(Nusxalab oling, u faqat 1 marta ko'rsatiladi!)");
                    document.getElementById("create-owner-id").value = "";
                    fetchDashboardData();
                } else {
                    alert("Xatolik: " + data.message);
                }
            } catch (err) {
                alert("Server xatosi: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        async function topUpPrompt(keyId) {
            if (!confirm("Ushbu kalit faollik muddatini yana +15 kunga uzaytirishni tasdiqlaysizmi?")) {
                return;
            }
            
            showLoader(true);
            try {
                const response = await fetch(`/admin/api/keys/${keyId}/topup?init_data=` + encodeURIComponent(tg.initData || ""), {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ amount: 15 })
                });
                const data = await response.json();
                if (data.status === "success") {
                    fetchDashboardData();
                } else {
                    alert("Xatolik: " + data.message);
                }
            } catch (err) {
                alert("Xatolik: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        async function toggleStatus(keyId, isActive) {
            try {
                const response = await fetch(`/admin/api/keys/${keyId}/toggle?init_data=` + encodeURIComponent(tg.initData || ""), {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ is_active: isActive })
                });
                const data = await response.json();
                if (data.status !== "success") {
                    alert("Holatni o'zgartirib bo'lmadi: " + data.message);
                    fetchDashboardData();
                }
            } catch (err) {
                alert("Ulanish xatosi: " + err.message);
                fetchDashboardData();
            }
        }

        async function deleteKey(keyId) {
            if (!confirm("Haqiqatan ham ushbu API kalitni butunlay o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi!")) {
                return;
            }
            showLoader(true);
            try {
                const response = await fetch(`/admin/api/keys/${keyId}?init_data=` + encodeURIComponent(tg.initData || ""), {
                    method: "DELETE",
                    headers
                });
                const data = await response.json();
                if (data.status === "success") {
                    fetchDashboardData();
                } else {
                    alert("O'chirishda xato: " + data.message);
                }
            } catch (err) {
                alert("Xatolik: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        function copyKeyText(plainText, keyId) {
            if (!plainText || plainText === 'Nusxalash') {
                alert("Kalitni faqat generatsiya vaqtida nusxalab olish mumkin! Xavfsizlik yuzasidan u bazada shifrlangan holatda saqlanadi.");
                return;
            }
            navigator.clipboard.writeText(plainText).then(() => {
                const el = document.getElementById("raw-key-" + keyId);
                const originalText = el.innerText;
                el.innerText = "Nusxalandi! ✅";
                setTimeout(() => {
                    el.innerText = originalText;
                }, 1500);
            }).catch(err => {
                alert("Nusxalashda xatolik yuz berdi. Kalit:\n" + plainText);
            });
        }

        function renderTariffs(tariffs) {
            const container = document.getElementById("tariffs-container");
            container.innerHTML = "";

            if (!tariffs || tariffs.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted-light); padding: 10px;">Tariflar topilmadi.</div>`;
                return;
            }

            tariffs.forEach(t => {
                const item = document.createElement("div");
                item.className = "tariff-item";
                
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 14px; font-weight: 800; color: #ffffff;">ID: ${t.id}</span>
                        <input type="number" id="tariff-votes-${t.id}" class="form-input" style="width: 80px;" value="${t.votes}" placeholder="Kun">
                        <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Kun</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; flex-grow: 1; justify-content: flex-end;">
                        <input type="number" id="tariff-price-${t.id}" class="form-input" style="width: 120px;" value="${t.price}" placeholder="Narxi">
                        <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">UZS</span>
                        <button onclick="updateTariff(${t.id})" class="btn">💾 Saqlash</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function updateTariff(tariffId) {
            const votesInput = document.getElementById("tariff-votes-" + tariffId);
            const priceInput = document.getElementById("tariff-price-" + tariffId);
            
            const votes = parseInt(votesInput.value);
            const price = parseInt(priceInput.value);
            
            if (isNaN(votes) || votes <= 0) {
                alert("Iltimos, to'g'ri kun sonini kiriting!");
                return;
            }
            if (isNaN(price) || price <= 0) {
                alert("Iltimos, to'g'ri narx kiriting!");
                return;
            }

            showLoader(true);
            try {
                const response = await fetch(`/admin/api/tariffs/${tariffId}?init_data=` + encodeURIComponent(tg.initData || "") + "&admin_token=" + encodeURIComponent(adminToken), {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ votes, price })
                });
                const data = await response.json();
                if (response.ok && data.status === "success") {
                    alert(data.message);
                    fetchDashboardData();
                } else {
                    alert("Xatolik: " + (data.message || "Tarifni o'zgartirib bo'lmadi."));
                }
            } catch (err) {
                alert("Server bilan bog'lanishda xato: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        async function saveSystemSettings() {
            const cardNumber = document.getElementById("settings-card-number").value.trim();
            const channelId = document.getElementById("settings-channel-id").value.trim();

            showLoader(true);
            try {
                const response = await fetch("/admin/api/settings?init_data=" + encodeURIComponent(tg.initData || "") + "&admin_token=" + encodeURIComponent(adminToken), {
                    method: "POST",
                    headers,
                    body: JSON.stringify({
                        card_number: cardNumber || null,
                        payment_channel_id: channelId || null
                    })
                });
                const data = await response.json();
                if (response.ok && data.status === "success") {
                    alert(data.message);
                    fetchDashboardData();
                } else {
                    alert("Xatolik: " + (data.message || "Sozlamalarni saqlab bo'lmadi."));
                }
            } catch (err) {
                alert("Server bilan bog'lanishda xato: " + err.message);
            } finally {
                showLoader(false);
            }
        }

        fetchDashboardData();
    </script>
</body>
</html>
