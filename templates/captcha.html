<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Tasdiqlash</title>
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        /* Puzzle maydoni */
        .puzzle-area {
            position: relative;
            width: 100%;
            height: 160px;
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            margin-bottom: 24px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 0),
                              radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        /* Puzl tushishi kerak bo'lgan bo'sh joy (Slot) */
        .puzzle-slot {
            position: absolute;
            top: 55px;
            left: 210px; /* Target pozitsiyasi */
            width: 50px;
            height: 50px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px dashed #6366f1;
            box-shadow: inset 0 0 10px rgba(99, 102, 241, 0.5);
            border-radius: 10px;
        }
        /* Siljiydigan rasm bo'lagi */
        .puzzle-piece {
            position: absolute;
            top: 55px;
            left: 10px; /* Boshlang'ich pozitsiya */
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 10;
            transition: transform 0.1s ease;
        }
        .puzzle-piece::before {
            content: "🧩";
        }
        /* Slider boshqaruvi */
        .slider-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            outline: none;
            padding: 0 4px;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 48px;
            height: 32px;
            border-radius: 16px;
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            transition: background 0.3s, transform 0.1s;
        }
        .slider::-webkit-slider-thumb:hover {
            background: linear-gradient(90deg, #0ea5e9, #4f46e5);
            transform: scale(1.05);
        }
        .slider-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: #64748b;
            pointer-events: none;
            font-weight: 500;
        }
        .status {
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            margin-top: 10px;
            transition: color 0.3s;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Xavfsizlik tekshiruvi</h2>
    <p>Ovoz berishni davom ettirish uchun boshqotirmani yeching. Puzl bo'lagini joyiga siljiting 👇</p>
    
    <div class="puzzle-area">
        <div class="puzzle-slot" id="slot"></div>
        <div class="puzzle-piece" id="piece"></div>
    </div>
    
    <div class="slider-container">
        <input type="range" min="0" max="100" value="0" class="slider" id="puzzleSlider">
        <span class="slider-label" id="sliderLabel">Suring ➡️</span>
    </div>
    
    <div class="status" id="statusMessage"></div>
</div>

<script>
    // Telegram WebApp sozlash
    const webapp = window.Telegram.WebApp;
    webapp.ready();
    webapp.expand(); // Oynani to'liq ochish

    // URL parametrlardan seans IDsini olish
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id') || 'default_sess';

    const slider = document.getElementById('puzzleSlider');
    const piece = document.getElementById('piece');
    const statusMessage = document.getElementById('statusMessage');
    const label = document.getElementById('sliderLabel');

    // Bo'shliq (target) pozitsiyasi: 210px. 
    // Slider minimal qiymati 0 da rasm chap tomonda 10px masofada bo'ladi.
    // Slider maksimal qiymati 100 da rasm chap tomondan 290px masofaga surilishi mumkin (umumiy kenglik 360px - 50px puzl - 20px chekkalari = 290px).
    // Target 210px ga yetishi uchun slider qiymati taxminan 71.4 ga teng bo'lishi kerak.
    // Biz target qiymatni tasodifiy o'zgartirsak ham bo'ladi, lekin simulyatsiya uchun 210px yetarli.
    const targetLeft = 210;
    const minLeft = 10;
    const maxLeft = 290;
    const range = maxLeft - minLeft;

    slider.addEventListener('input', function() {
        const percent = slider.value / 100;
        const currentLeft = minLeft + (percent * range);
        piece.style.left = currentLeft + 'px';
        
        // Suring yozuvini yashirib borish
        if (slider.value > 10) {
            label.style.opacity = '0';
        } else {
            label.style.opacity = '1';
        }
    });

    slider.addEventListener('change', function() {
        const percent = slider.value / 100;
        const currentLeft = minLeft + (percent * range);
        const difference = Math.abs(currentLeft - targetLeft);

        // Agar puzl 6 piksel atrofida yaqin bo'lsa (to'g'ri joylashtirildi)
        if (difference <= 6) {
            statusMessage.className = "status success";
            statusMessage.innerText = "✓ Muvaffaqiyatli tasdiqlandi!";
            piece.style.left = targetLeft + 'px'; // Puzlni aniq joyiga qulflaymiz
            slider.disabled = true;
            
            // Vibratsiya effektini berish (Haptic Feedback)
            if (webapp.HapticFeedback) {
                webapp.HapticFeedback.notificationOccurred('success');
            }

            // WebApp orqali botga natija yuborish
            setTimeout(() => {
                const result = {
                    status: "success",
                    captcha_code: "puzzle_ok_" + Math.floor(Math.random() * 10000),
                    session_id: sessionId
                };
                // Telegram botga ma'lumotni jo'natib veb-oynani yopamiz
                webapp.sendData(JSON.stringify(result));
            }, 1000);

        } else {
            // Noto'g'ri bo'lsa, qaytarib yuboramiz
            statusMessage.className = "status error";
            statusMessage.innerText = "❌ Noto'g'ri joylashtirildi. Qayta urinib ko'ring.";
            
            if (webapp.HapticFeedback) {
                webapp.HapticFeedback.notificationOccurred('error');
            }

            // Qaytadan 0 holatga qaytarish
            setTimeout(() => {
                slider.value = 0;
                piece.style.left = minLeft + 'px';
                label.style.opacity = '1';
                statusMessage.innerText = "";
            }, 800);
        }
    });
</script>

</body>
</html>
