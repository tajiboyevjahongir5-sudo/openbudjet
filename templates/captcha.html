<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Tasdiqlash</title>
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #09090b 0%, #1e1b4b 50%, #020617 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(99, 102, 241, 0.1);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        /* Real Captcha Styling */
        .real-captcha-img-box {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        .real-captcha-img-box img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .captcha-text-input {
            width: 100%;
            height: 48px;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .captcha-text-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.4);
        }
        .submit-captcha-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .submit-captcha-btn:active {
            transform: scale(0.98);
        }

        /* Puzzle maydoni */
        .puzzle-area {
            position: relative;
            width: 100%;
            height: 160px;
            background: #090d16;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-bottom: 24px;
            background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1px, transparent 0),
                              radial-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        /* Puzl tushishi kerak bo'lgan bo'sh joy (Slot) */
        .puzzle-slot {
            position: absolute;
            top: 55px;
            left: 210px; /* Target pozitsiyasi */
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px dashed #818cf8;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.6),
                        0 0 10px rgba(99, 102, 241, 0.2);
            border-radius: 12px;
        }
        /* Siljiydigan rasm bo'lagi */
        .puzzle-piece {
            position: absolute;
            top: 55px;
            left: 10px; /* Boshlang'ich pozitsiya */
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6),
                        0 4px 12px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            z-index: 10;
            transition: transform 0.1s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .puzzle-piece::before {
            content: "🧩";
        }
        /* Slider boshqaruvi */
        .slider-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 44px;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            outline: none;
            padding: 0 4px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 54px;
            height: 36px;
            border-radius: 18px;
            background: linear-gradient(90deg, #38bdf8 0%, #a855f7 100%);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5),
                        0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background 0.3s, transform 0.15s, box-shadow 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .slider::-webkit-slider-thumb:hover {
            background: linear-gradient(90deg, #0ea5e9 0%, #c084fc 100%);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.7);
        }
        .slider-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: #4b5563;
            pointer-events: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: shimmer 2s infinite alternate;
        }
        @keyframes shimmer {
            from { opacity: 0.5; color: #4b5563; }
            to { opacity: 1; color: #9ca3af; }
        }
        .status {
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            margin-top: 10px;
            transition: color 0.3s;
        }
        .success {
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .error {
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Xavfsizlik tekshiruvi</h2>
    
    {% if captcha_image %}
    <!-- Real Captcha Form -->
    <div id="real-captcha-container">
        <div class="real-captcha-img-box">
            <img src="data:image/png;base64,{{ captcha_image }}" id="captchaImg" alt="Captcha" />
        </div>
        <p>Rasmda ko'rsatilgan ifoda yoki kod javobini yozing 👇</p>
        <input type="text" id="captchaInput" class="captcha-text-input" placeholder="Matnni kiriting..." autocomplete="off" />
        <button type="button" id="submitCaptchaBtn" class="submit-captcha-btn">Tasdiqlash</button>
    </div>
    {% else %}
    <!-- Mock Slider Captcha -->
    <div id="mock-captcha-container">
        <p>Ovoz berishni davom ettirish uchun boshqotirmani yeching. Puzl bo'lagini joyiga siljiting 👇</p>
        <div class="puzzle-area">
            <div class="puzzle-slot" id="slot"></div>
            <div class="puzzle-piece" id="piece"></div>
        </div>
        <div class="slider-container">
            <input type="range" min="0" max="100" value="0" class="slider" id="puzzleSlider">
            <span class="slider-label" id="sliderLabel">Suring ➡️</span>
        </div>
    </div>
    {% endif %}
    
    <div class="status" id="statusMessage"></div>
</div>

<script>
    const webapp = window.Telegram.WebApp;
    webapp.ready();
    webapp.expand();

    const statusMessage = document.getElementById("statusMessage");

    {% if captcha_image %}
    // Real Captcha Submission Logic
    const submitBtn = document.getElementById("submitCaptchaBtn");
    const captchaInput = document.getElementById("captchaInput");

    submitBtn.addEventListener("click", () => {
        const val = captchaInput.value.trim();
        if (!val) {
            statusMessage.className = "status error";
            statusMessage.innerText = "❌ Iltimos, javobni kiriting!";
            return;
        }

        statusMessage.className = "status success";
        statusMessage.innerText = "✓ Muvaffaqiyatli tasdiqlandi!";

        const result = {
            status: "success",
            captcha_result: val,
            captcha_key: "{{ captcha_key }}",
            session_id: "{{ session_id }}"
        };
        webapp.sendData(JSON.stringify(result));
    });

    captchaInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            submitBtn.click();
        }
    });
    {% else %}
    // Mock Slider Logic
    const slider = document.getElementById("puzzleSlider");
    const piece = document.getElementById("piece");
    const label = document.getElementById("sliderLabel");
    
    const minLeft = 10;
    const maxLeft = 290;
    const targetLeft = 210;

    slider.addEventListener("input", () => {
        const percentage = slider.value / 100;
        const currentLeft = minLeft + percentage * (maxLeft - minLeft);
        piece.style.left = currentLeft + 'px';
        
        label.style.opacity = (1 - percentage * 2);
    });

    slider.addEventListener("change", () => {
        const percentage = slider.value / 100;
        const currentLeft = minLeft + percentage * (maxLeft - minLeft);
        const difference = Math.abs(currentLeft - targetLeft);

        if (difference <= 6) {
            statusMessage.className = "status success";
            statusMessage.innerText = "✓ Muvaffaqiyatli tasdiqlandi!";
            piece.style.left = targetLeft + 'px';
            slider.disabled = true;
            
            if (webapp.HapticFeedback) {
                webapp.HapticFeedback.notificationOccurred('success');
            }

            const result = {
                status: "success",
                captcha_result: "1", // Mock captcha key
                captcha_key: "mock_captcha_key",
                session_id: "{{ session_id }}"
            };
            webapp.sendData(JSON.stringify(result));
        } else {
            statusMessage.className = "status error";
            statusMessage.innerText = "❌ Noto'g'ri joylashtirildi. Qayta urinib ko'ring.";
            
            if (webapp.HapticFeedback) {
                webapp.HapticFeedback.notificationOccurred('error');
            }

            setTimeout(() => {
                slider.value = 0;
                piece.style.left = minLeft + 'px';
                label.style.opacity = '1';
                statusMessage.innerText = "";
            }, 800);
        }
    });
    {% endif %}
</script>

</body>
</html>
